const seed={"orders":[],"recipe":[{"name":"Eigelb","qty":0.5,"unit":"Kilogramm"},{"name":"Dosenmilch","qty":2.04,"unit":"Liter"},{"name":"Sahne","qty":0.8,"unit":"Liter"},{"name":"Vanillezucker","qty":96,"unit":"Gramm"},{"name":"Puderzucker","qty":1.2,"unit":"Kilogramm"},{"name":"Kirschlikör","qty":0.12,"unit":"Liter"},{"name":"Alkohol 96%","qty":0.8,"unit":"Liter"}],"costs":{"2023":{"plannedLitres":0,"ingredients":[],"bottles":[{"size":0.25,"count":0,"purchaseCost":0,"salePrice":8},{"size":0.5,"count":0,"purchaseCost":0,"salePrice":12},{"size":1,"count":0,"purchaseCost":0,"salePrice":20}]},"2024":{"plannedLitres":0,"ingredients":[],"bottles":[{"size":0.25,"count":0,"purchaseCost":0,"salePrice":8},{"size":0.5,"count":0,"purchaseCost":0,"salePrice":12},{"size":1,"count":0,"purchaseCost":0,"salePrice":20}]},"2025":{"plannedLitres":0,"ingredients":[],"bottles":[{"size":0.25,"count":0,"purchaseCost":0,"salePrice":8},{"size":0.5,"count":0,"purchaseCost":0,"salePrice":12},{"size":1,"count":0,"purchaseCost":0,"salePrice":20}]},"2026":{"plannedLitres":0,"ingredients":[],"bottles":[{"size":0.25,"count":0,"purchaseCost":0,"salePrice":8},{"size":0.5,"count":0,"purchaseCost":0,"salePrice":12},{"size":1,"count":0,"purchaseCost":0,"salePrice":20}]}},"importedAt":null};
let db=JSON.parse(localStorage.getItem('likoer_db')||'null')||seed;
let dirty=localStorage.getItem('likoer_dirty')==='1';
let remoteRev=localStorage.getItem('likoer_remote_rev')||null;
const DROPBOX_PATH='/eierlikoer-daten.json';
const tokenKey='likoer_dropbox_token';
const keyKey='likoer_dropbox_app_key';
let tokenData=JSON.parse(sessionStorage.getItem(tokenKey)||'null');
let year=2026, page='dashboard', recipeLitres=5, orderFilter='all';
function save(){localStorage.setItem('likoer_db',JSON.stringify(db));dirty=true;localStorage.setItem('likoer_dirty','1');updateCloudUI();}
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const fmt=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(Number(n)||0);
const bottleLabel=s=>s===1?'1.000 ml':s===.5?'500 ml':s===.25?'250 ml':fmt(s*1000)+' ml';
const rows=()=>db.orders.filter(o=>Number(o.year)===Number(year));
function stats(){let a=rows(),sales=a.filter(x=>x.type==='Verkauf'),gifts=a.filter(x=>x.type==='Geschenk'),revenue=sales.reduce((s,x)=>s+x.qty*x.unitPrice,0),litres=a.reduce((s,x)=>s+x.qty*x.size,0);return {a,sales,gifts,revenue,litres,open:a.filter(x=>!x.delivered).length};}
function inventory(){let c=db.costs[String(year)]||{}, bottles=c.bottles||[];return bottles.map(b=>{let a=rows().filter(x=>x.size===b.size),reserved=a.filter(x=>!x.delivered).reduce((s,x)=>s+x.qty,0),delivered=a.filter(x=>x.delivered).reduce((s,x)=>s+x.qty,0),adjustments=(db.stockAdjustments||[]).filter(x=>Number(x.year)===Number(year)&&Number(x.size)===Number(b.size)).reduce((s,x)=>s+Number(x.delta),0),onHand=Number(b.count||0)+adjustments-delivered;return {...b,reserved,delivered,adjustments,onHand,available:onHand-reserved};});}
function toggleMobileNav(){const nav=document.getElementById('mainNav'),btn=document.getElementById('mobileNavToggle');const open=nav.classList.toggle('mobileOpen');btn.setAttribute('aria-expanded',String(open));btn.innerHTML=open?'✕ Menü schließen':'☰ Menü <span aria-hidden="true">▾</span>'; }
function go(p){if(window.matchMedia('(max-width:900px)').matches){document.getElementById('mainNav').classList.remove('mobileOpen');const btn=document.getElementById('mobileNavToggle');btn.setAttribute('aria-expanded','false');btn.innerHTML='☰ Menü <span aria-hidden="true">▾</span>';}page=p;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!==p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));let titles={dashboard:['Übersicht','Alles Wichtige auf einen Blick.'],orders:['Verkäufe & Geschenke','Bestellungen eintragen, nachverfolgen und verwalten.'],stock:['Lagerbestand','Produktion, Reservierungen und verfügbare Flaschen.'],recipe:['Rezept-Rechner','Zutatenmengen passend zur gewünschten Produktionsmenge.'],costs:['Kalkulation','Einkaufskosten und Verkaufspreise pflegen.'],settings:['Einstellungen','Dropbox, Datensicherung und einmalige Einrichtung.']};document.getElementById('pageTitle').textContent=titles[p][0];document.getElementById('pageSub').textContent=titles[p][1];render();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('yearSelect').onchange=e=>{year=+e.target.value;render();};
function refreshYears(){const el=document.getElementById('yearSelect');const years=Object.keys(db.costs||{}).map(Number).sort((a,b)=>b-a);el.innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');if(!years.includes(year))year=years[0]||new Date().getFullYear();el.value=year;}
function addYear(){const available=Object.keys(db.costs||{}).map(Number);const next=Math.max(new Date().getFullYear()-1,...available)+1;if(db.costs[String(next)])return;const previous=db.costs[String(next-1)]||db.costs[String(Math.max(...available))]||{ingredients:[],bottles:[]};if(!confirm(`Neues Jahr ${next} anlegen?\n\nFlaschengrößen, Einkaufspreise und Zutaten werden als Vorlage übernommen. Bestellungen und Ausgangsbestände starten leer.`))return;db.costs[String(next)]={plannedLitres:0,ingredients:(previous.ingredients||[]).map(x=>({...x})),bottles:(previous.bottles||[]).map(b=>({...b,count:0}))};save();year=next;refreshYears();go('dashboard');}
function render(){({dashboard:renderDashboard,orders:renderOrders,stock:renderStock,recipe:renderRecipe,costs:renderCosts,settings:renderSettings})[page]();}
function renderSettings(){document.getElementById('settings').innerHTML=`
<div class="panel"><h2>So funktioniert die Nutzung</h2><ol class="guide"><li><b>Öffnen:</b> App starten und bei Bedarf Dropbox verbinden.</li><li><b>Laden:</b> Oben auf „Laden“ tippen, bevor ihr etwas ändert.</li><li><b>Bearbeiten:</b> Bestellungen, Produktionen oder Kalkulationen eintragen.</li><li><b>Speichern:</b> Oben auf „Speichern“ tippen. Erst danach sieht das andere Gerät die Änderungen nach erneutem Laden.</li></ol><p class="muted">Wenn ihr nur nachschaut, müsst ihr nicht speichern. Bitte nicht gleichzeitig auf zwei Geräten bearbeiten.</p></div>
<div class="panel"><div class="panelhead"><h2>Dropbox-Verbindung</h2></div>
<p class="muted">Für den gemeinsamen Datenstand. Beim ersten Mal oder nach Ablauf der Anmeldung erneut verbinden.</p>
<label class="settingsLabel">Dropbox-App-Schlüssel <input id="appKey" class="field" placeholder="Öffentlicher App-Schlüssel" autocomplete="off"></label>
<div class="settingsActions"><button class="btn light" onclick="connectDropbox()">Dropbox verbinden</button><button class="btn ghost" onclick="disconnectDropbox()">Verbindung auf diesem Gerät trennen</button></div>
<p id="cloudMessage" class="notice" role="status">Lade zuerst den aktuellen Stand, bevor du Änderungen vornimmst.</p></div>
<div class="panel"><h2>Jahre verwalten</h2><p class="muted">Ein neues Jahr übernimmt die Flaschengrößen und Kalkulationsvorlagen des Vorjahrs, aber keine Bestellungen und keine Anfangsbestände.</p><button class="btn light" onclick="addYear()">+ Nächstes Jahr anlegen</button></div>
<div class="panel"><h2>Datensicherung &amp; Wiederherstellung</h2><p class="muted">Sichere eure Daten regelmäßig auf einem Gerät. Eine Sicherungsdatei enthält auch Kundennamen und gehört nicht auf GitHub.</p><div class="settingsActions"><button class="btn light" onclick="downloadBackup()">Sicherung herunterladen</button><label class="btn ghost fileButton">Sicherung einlesen<input type="file" accept=".json,application/json" hidden onchange="restoreBackup(event)"></label></div><div class="notice">Wiederherstellen ersetzt den lokalen Datenstand. Danach erst prüfen und bewusst in Dropbox speichern.</div></div>
<div class="panel"><h2>Ersteinrichtung &amp; alte Daten</h2><ol class="guide"><li>GitHub Pages für das öffentliche, <b>datenfreie</b> App-Gerüst aktivieren und die bereinigte <code>index.html</code> veröffentlichen.</li><li>In der Dropbox-Entwicklerverwaltung eine App mit Zugriff <b>App-Ordner</b> erstellen.</li><li>Unter Berechtigungen <code>files.content.read</code>, <code>files.content.write</code> und <code>files.metadata.read</code> aktivieren.</li><li>Unter Einstellungen die exakte HTTPS-Webadresse als <b>Weiterleitungsadresse</b> eintragen.</li><li>Den öffentlichen <b>App-Schlüssel</b> oben im Abschnitt Dropbox-Verbindung eintragen (niemals das App-Geheimnis), dann „Dropbox verbinden“ wählen und den Zugriff erlauben.</li><li>Auf dem ersten Gerät den gemeinsamen Stand speichern; auf dem zweiten Gerät mit demselben Dropbox-Konto verbinden und „Laden“ wählen.</li></ol><p class="muted">Im Alltag: vor dem Bearbeiten laden, danach speichern. Eine Dropbox-Anmeldung kann gelegentlich erneut erforderlich sein.</p><div class="settingsActions"><label class="btn ghost fileButton">Historische Daten importieren<input type="file" accept=".json,application/json" hidden onchange="importHistoryFile(event)"></label></div><p class="footnote">Historische Bestände und uneinheitliche Excel-Kalkulationen müssen weiterhin überprüft werden. Keine Importdateien mit Kundendaten öffentlich hochladen.</p></div>`;updateCloudUI();}

let search=document.getElementById('searchOrder'),filter=document.getElementById('filterOrder');filter.value=orderFilter;function fill(){let q=search.value.toLowerCase(),list=rows().filter(o=>(orderFilter==='all'||o.type===orderFilter)&&(`${o.name} ${o.note}`.toLowerCase().includes(q)));document.getElementById('orderBody').innerHTML=list.map(o=>`<tr><td><span class="pill ${o.type==='Geschenk'?'gift':''}">${o.type}</span></td><td>${esc(o.name)}</td><td>${fmt(o.qty)}</td><td>${bottleLabel(o.size)}</td><td>${o.type==='Verkauf'?eur(o.qty*o.unitPrice):'–'}</td><td><button class="btn ${o.delivered?'light':'ghost'}" style="padding:6px 9px" onclick="toggleDelivered('${o.id}')">${o.delivered?'Ja':'Offen'}</button></td><td><div class="rowActions"><button class="btn ghost" style="padding:6px 9px" onclick="editOrder('${o.id}')">Bearbeiten</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Keine passenden Einträge.</td></tr>';}search.oninput=fill;filter.onchange=e=>{orderFilter=e.target.value;fill();};fill();}

function renderRecipe(){let f=recipeLitres/5;document.getElementById('recipe').innerHTML=`<div class="panel"><div class="panelhead"><h2>Wie viel Eierlikör möchtet ihr machen?</h2></div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><input class="biginput" id="litres" type="number" min=".1" step=".5" value="${recipeLitres}"><strong>Liter Eierlikör</strong><button class="btn light" onclick="setRecipe(5)">5 l</button><button class="btn light" onclick="setRecipe(10)">10 l</button><button class="btn light" onclick="setRecipe(20)">20 l</button></div><div class="recipegrid" style="margin-top:22px">${db.recipe.map(i=>`<div class="ingredient"><span>${esc(i.name)}</span><strong>${fmt(i.qty*f)} ${unitShort(i.unit)}</strong></div>`).join('')}</div><div class="notice">Berechnung basiert auf eurem Grundrezept für 5 Liter. Bitte beachtet, dass tatsächliche Ausbeute und Abfüllverluste leicht abweichen können.</div><button class="btn" onclick="copyRecipe()">Zutatenliste kopieren</button></div>`;document.getElementById('litres').oninput=e=>{recipeLitres=Math.max(.1,Number(e.target.value)||.1);renderRecipe();let el=document.getElementById('litres');el.focus();};}
function unitShort(u){return ({Kilogramm:'kg',Liter:'l',Gramm:'g'})[u]||u;}

// Kalkulation V6: eigene Jahresplanung, unabhängig von den unveränderten historischen Excel-Kosten.
const CALC_UNITS=['g','kg','ml','l','Stück'];
function calcUnitBase(q,u){return Number(q||0)*({'g':1,'kg':1000,'ml':1,'l':1000,'Stück':1}[u]||1)}
function calcUnitFamily(u){return u==='g'||u==='kg'?'weight':u==='ml'||u==='l'?'volume':'piece'}
function initialPlan(){return {litres:0,ingredients:(db.recipe||[]).map(r=>({name:r.name,packQty:'',packUnit:r.unit==='Kilogramm'?'kg':r.unit==='Liter'?'l':'g',packPrice:'',usedQty:'',usedUnit:r.unit==='Kilogramm'?'kg':r.unit==='Liter'?'l':'g'})),packaging:[{size:.25,plannedQty:0,packQty:0,packPrice:0,extrasPerBottle:0,salePrice:8},{size:.5,plannedQty:0,packQty:0,packPrice:0,extrasPerBottle:0,salePrice:12},{size:1,plannedQty:0,packQty:0,packPrice:0,extrasPerBottle:0,salePrice:20}],other:[]};}
function planForYear(){const c=db.costs[String(year)]||(db.costs[String(year)]={ingredients:[],bottles:[],plannedLitres:0});if(!c.planning){c.planning=initialPlan();(c.bottles||[]).forEach(b=>{const p=c.planning.packaging.find(x=>Number(x.size)===Number(b.size));if(p)p.salePrice=Number(b.salePrice)||0;});}return c.planning;}
function calcInput(value,field,index,group,type='number',step='.01'){return `<input class="field calcField" type="${type}" ${type==='number'?`min="0" step="${step}"`:''} data-group="${group}" data-index="${index}" data-field="${field}" value="${esc(value??'')}" aria-label="${esc(field)}">`;}
function calcUnitSelect(value,field,index,group){return `<select class="field calcField" data-group="${group}" data-index="${index}" data-field="${field}">${CALC_UNITS.map(u=>`<option ${u===value?'selected':''}>${u}</option>`).join('')}</select>`;}
function calcReadDraft(){const p=structuredClone(planForYear());p.litres=Number(document.getElementById('calcLitres')?.value)||0;document.querySelectorAll('.calcField').forEach(el=>{const a=p[el.dataset.group],row=a?.[Number(el.dataset.index)];if(!row)return;row[el.dataset.field]=el.type==='number'?(el.value===''?'':Number(el.value)):el.value;});return p;}
function calcNumbers(p){let ingredientCost=0,ingredientPurchases=0,issues=[];for(const x of p.ingredients){const pq=calcUnitBase(x.packQty,x.packUnit),uq=calcUnitBase(x.usedQty,x.usedUnit),price=Number(x.packPrice)||0;if(calcUnitFamily(x.packUnit)!==calcUnitFamily(x.usedUnit)){issues.push(`Einheiten bei ${x.name||'Zutat'} stimmen nicht überein`);continue;}if(uq>0&&pq<=0){issues.push(`Packungsmenge bei ${x.name||'Zutat'} fehlt`);continue;}if(pq>0){ingredientCost+=uq/pq*price;ingredientPurchases+=Math.ceil(uq/pq)*price;}}
let packagingCost=0,packagingPurchases=0,plannedRevenue=0,plannedCount=0,plannedLitresFromBottles=0;for(const b of p.packaging){const qty=Number(b.plannedQty)||0,packQty=Number(b.packQty)||0,packPrice=Number(b.packPrice)||0,extra=Number(b.extrasPerBottle)||0;plannedCount+=qty;plannedLitresFromBottles+=qty*Number(b.size);plannedRevenue+=qty*(Number(b.salePrice)||0);if(qty>0&&packQty<=0){issues.push(`Packungsinhalt für ${bottleLabel(Number(b.size))} fehlt`);}else if(packQty>0){packagingCost+=qty/packQty*packPrice;packagingPurchases+=Math.ceil(qty/packQty)*packPrice;}packagingCost+=qty*extra;packagingPurchases+=qty*extra;}
const otherCost=p.other.reduce((n,x)=>n+(Number(x.amount)||0),0),totalCost=ingredientCost+packagingCost+otherCost,litres=Number(p.litres)||0;const liquidPerL=litres?ingredientCost/litres:0,overheadPerBottle=plannedCount?otherCost/plannedCount:0;
const unitCosts=Object.fromEntries(p.packaging.map(b=>[String(b.size),Number(b.size)*liquidPerL+(Number(b.packQty)>0?(Number(b.packPrice)||0)/Number(b.packQty):0)+(Number(b.extrasPerBottle)||0)+overheadPerBottle]));
const sales=rows().filter(o=>o.type==='Verkauf'),gifts=rows().filter(o=>o.type==='Geschenk'),deliveredSales=sales.filter(o=>o.delivered),deliveredGifts=gifts.filter(o=>o.delivered);const realizedRevenue=deliveredSales.reduce((n,o)=>n+(Number(o.qty)||0)*(Number(o.unitPrice)||0),0),realizedCost=[...deliveredSales,...deliveredGifts].reduce((n,o)=>n+(Number(o.qty)||0)*(unitCosts[String(o.size)]||0),0),reservedRevenue=sales.filter(o=>!o.delivered).reduce((n,o)=>n+(Number(o.qty)||0)*(Number(o.unitPrice)||0),0);const giftCount=gifts.reduce((n,o)=>n+(Number(o.qty)||0),0);return {ingredientCost,ingredientPurchases,packagingCost,packagingPurchases,otherCost,totalCost,plannedRevenue,plannedCount,plannedLitresFromBottles,unitCosts,liquidPerL,overheadPerBottle,realizedRevenue,realizedCost,realizedProfit:realizedRevenue-realizedCost,reservedRevenue,giftCount,issues};}
function renderCosts(){const p=planForYear(),n=calcNumbers(p);document.getElementById('costs').innerHTML=`
<div class="panel"><div class="panelhead"><h2>Jahreskalkulation ${year}</h2><button class="btn" onclick="saveCosts()">Kalkulation übernehmen</button></div><p class="muted">Trage deine Einkäufe und die für die geplante Herstellung benötigten Mengen ein. Die Berechnungen aktualisieren sich beim Eingeben. Erst „Kalkulation übernehmen“ speichert lokal; danach oben in Dropbox speichern.</p><label class="settingsLabel">Geplante Eierlikörmenge in Litern <input id="calcLitres" class="field" type="number" min="0" step=".1" value="${esc(p.litres)}"></label><p class="footnote">Die Literzahl wird für die Flüssigkeitskosten je Liter benötigt. Die geplanten Flaschenmengen gibst du unten separat an.</p></div>
<div class="panel"><div class="panelhead"><h2>1 · Zutaten einkaufen</h2><button class="btn light" onclick="calcAdd('ingredients')">+ Zutat</button></div><p class="muted">Beispiel: Sahne · Packung 1 l · Packungspreis 2,49 € · verwendet 0,8 l. Es zählt nur die verbrauchte Menge zu den Herstellungskosten; der notwendige Packungskauf wird separat angezeigt.</p><div class="tableScroll"><table class="calcTable"><thead><tr><th>Zutat</th><th>Packungsmenge</th><th>Einheit</th><th>Preis je Packung (€)</th><th>Verwendet</th><th>Einheit</th><th></th></tr></thead><tbody>${p.ingredients.map((x,i)=>`<tr><td>${calcInput(x.name,'name',i,'ingredients','text')}</td><td>${calcInput(x.packQty,'packQty',i,'ingredients')}</td><td>${calcUnitSelect(x.packUnit,'packUnit',i,'ingredients')}</td><td>${calcInput(x.packPrice,'packPrice',i,'ingredients')}</td><td>${calcInput(x.usedQty,'usedQty',i,'ingredients')}</td><td>${calcUnitSelect(x.usedUnit,'usedUnit',i,'ingredients')}</td><td><button class="btn ghost smallBtn" onclick="calcRemove('ingredients',${i})" aria-label="Zutat entfernen">✕</button></td></tr>`).join('')}</tbody></table></div></div>
<div class="panel"><div class="panelhead"><h2>2 · Flaschen &amp; Verpackung</h2></div><p class="muted">Trage ein, wie viele Flaschen du abfüllen möchtest. Der Packungspreis gilt für eine Packung leerer Flaschen. Deckel, Etikett usw. kannst du als Zusatzkosten pro Flasche erfassen.</p><div class="tableScroll"><table class="calcTable"><thead><tr><th>Größe</th><th>Geplante Stück</th><th>Stück je Einkaufspackung</th><th>Packungspreis (€)</th><th>Deckel/Etikett je Stück (€)</th><th>Verkaufspreis (€)</th></tr></thead><tbody>${p.packaging.map((b,i)=>`<tr><td>${bottleLabel(Number(b.size))}</td><td>${calcInput(b.plannedQty,'plannedQty',i,'packaging','number','1')}</td><td>${calcInput(b.packQty,'packQty',i,'packaging','number','1')}</td><td>${calcInput(b.packPrice,'packPrice',i,'packaging')}</td><td>${calcInput(b.extrasPerBottle,'extrasPerBottle',i,'packaging')}</td><td>${calcInput(b.salePrice,'salePrice',i,'packaging')}</td></tr>`).join('')}</tbody></table></div></div>
<div class="panel"><div class="panelhead"><h2>3 · Weitere Kosten</h2><button class="btn light" onclick="calcAdd('other')">+ Kostenposition</button></div><p class="muted">Zum Beispiel Strom, Transport oder sonstige Ausgaben für die geplante Jahresproduktion.</p>${p.other.length?`<div class="tableScroll"><table class="calcTable"><thead><tr><th>Beschreibung</th><th>Gesamtkosten (€)</th><th></th></tr></thead><tbody>${p.other.map((x,i)=>`<tr><td>${calcInput(x.name,'name',i,'other','text')}</td><td>${calcInput(x.amount,'amount',i,'other')}</td><td><button class="btn ghost smallBtn" onclick="calcRemove('other',${i})">✕</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Noch keine weiteren Kosten erfasst.</p>'}</div>
<div class="panel"><h2>4 · Kosten &amp; Verkaufspreise</h2><div id="calcResults" aria-live="polite"></div></div>
<div class="panel"><h2>5 · Geplant und tatsächlich abgegeben</h2><p class="muted">Die tatsächliche Auswertung nutzt eure Verkaufsliste. Als „tatsächlich“ gelten hier <b>abgegebene</b> Flaschen – nicht nachgewiesene Zahlungen. Der Gewinn ist eine <b>Schätzung auf Basis der kalkulierten Stückkosten</b>, keine Buchhaltungs- oder Steuerabrechnung.</p><div id="calcActual" aria-live="polite"></div><div class="notice">Die Kalkulation wird für jedes Jahr separat gespeichert. Historische Anfangsbestände und die ursprünglichen Excel-Kalkulationen müssen weiterhin geprüft werden. Änderungen an Verkaufspreisen hier gelten für neue Bestellungen, nicht rückwirkend für alte Einträge.</div></div>`;
document.querySelectorAll('.calcField').forEach(el=>{el.addEventListener('input',calcPreview);el.addEventListener('change',calcPreview)});document.getElementById('calcLitres').addEventListener('input',calcPreview);calcPreview();}
function calcPreview(){const p=calcReadDraft(),n=calcNumbers(p),litres=Number(p.litres)||0;const msg=n.issues.length?`<div class="notice">Bitte prüfen: ${n.issues.map(esc).join('; ')}. Unvollständige Positionen werden nicht voll berechnet.</div>`:'';document.getElementById('calcResults').innerHTML=`<div class="cards calcCards"><div class="card"><div class="label">Zutatenverbrauch</div><div class="value">${eur(n.ingredientCost)}</div></div><div class="card"><div class="label">Herstellungskosten gesamt</div><div class="value">${eur(n.totalCost)}</div></div><div class="card"><div class="label">Flüssigkeit je Liter</div><div class="value">${litres?eur(n.liquidPerL):'–'}</div></div><div class="card"><div class="label">Kosten je fertigem Liter</div><div class="value">${n.plannedLitresFromBottles?eur(n.totalCost/n.plannedLitresFromBottles):'–'}</div></div></div><div class="tableScroll"><table><thead><tr><th>Kostenübersicht</th><th>Betrag</th></tr></thead><tbody><tr><td>Verwendete Zutaten</td><td>${eur(n.ingredientCost)}</td></tr><tr><td>Verpackung inkl. Etiketten</td><td>${eur(n.packagingCost)}</td></tr><tr><td>Weitere Kosten</td><td>${eur(n.otherCost)}</td></tr><tr><td><b>Gesamte Herstellungskosten</b></td><td><b>${eur(n.totalCost)}</b></td></tr><tr><td>Geschätzte Einkaufsausgaben für Zutaten und Verpackung (ganze Packungen)</td><td>${eur(n.ingredientPurchases+n.packagingPurchases)}</td></tr></tbody></table></div><h3>Kosten und Preisvorschläge pro Flasche</h3><div class="tableScroll"><table><thead><tr><th>Größe</th><th>Stückkosten</th><th>Faktor 2,5</th><th>Faktor 3</th><th>Euer Verkaufspreis</th></tr></thead><tbody>${p.packaging.map(b=>{const c=n.unitCosts[String(b.size)]||0;return `<tr><td>${bottleLabel(Number(b.size))}</td><td>${litres?eur(c):'–'}</td><td>${litres?eur(c*2.5):'–'}</td><td>${litres?eur(c*3):'–'}</td><td>${eur(b.salePrice)}</td></tr>`}).join('')}</tbody></table></div>${msg}<p class="footnote">Die Stückkosten enthalten Flüssigkeit, leere Flasche, Zusatzkosten und anteilige sonstige Kosten. Für belastbare Werte müssen geplante Literzahl und Flaschenanzahl zusammenpassen. Abfüllmenge laut Flaschenplanung: ${fmt(n.plannedLitresFromBottles)} Liter.</p>`;
const plannedProfit=n.plannedRevenue-n.totalCost;document.getElementById('calcActual').innerHTML=`<div class="cards calcCards"><div class="card"><div class="label">Geplanter Umsatz (alle geplanten Flaschen verkauft)</div><div class="value">${eur(n.plannedRevenue)}</div></div><div class="card"><div class="label">Geplanter Gewinn</div><div class="value">${eur(plannedProfit)}</div></div><div class="card"><div class="label">Umsatz abgegebener Verkäufe</div><div class="value">${eur(n.realizedRevenue)}</div></div><div class="card"><div class="label">Geschätzter Gewinn abgegebener Verkäufe inkl. Geschenk-Kosten</div><div class="value">${litres?eur(n.realizedProfit):'–'}</div></div></div><div class="tableScroll"><table><tbody><tr><td>Offene Verkaufsbestellungen (noch nicht abgegeben)</td><td>${eur(n.reservedRevenue)}</td></tr><tr><td>Geschenke in der Verkaufsliste (alle Status)</td><td>${fmt(n.giftCount)} Flaschen</td></tr><tr><td>Geschätzte Kosten aller abgegebenen Verkäufe und Geschenke</td><td>${litres?eur(n.realizedCost):'–'}</td></tr></tbody></table></div><p class="footnote">Die geplante Rechnung nimmt an, dass alle geplanten Flaschen verkauft werden. Tatsächliche Geschenke werden bei den geschätzten Kosten berücksichtigt; offene Bestellungen sind noch kein erzielter Umsatz. Der Jahresgewinn ist erst sinnvoll interpretierbar, wenn Produktionsmenge, Abgaben und Bestände vollständig erfasst sind.</p>`;}
function calcAdd(group){const p=calcReadDraft();p[group].push(group==='ingredients'?{name:'',packQty:'',packUnit:'g',packPrice:'',usedQty:'',usedUnit:'g'}:{name:'',amount:''});db.costs[String(year)].planning=p;renderCosts();}
function calcRemove(group,index){const p=calcReadDraft();p[group].splice(index,1);db.costs[String(year)].planning=p;renderCosts();}
function saveCosts(){const p=calcReadDraft(),n=calcNumbers(p);if(n.issues.length){alert('Bitte zuerst fehlende oder unpassende Packungsmengen/Einheiten korrigieren:\n'+n.issues.join('\n'));return;}if(p.litres<=0){alert('Bitte die geplante Eierlikörmenge in Litern eingeben.');return;}if(p.packaging.some(b=>Number(b.plannedQty)<0||!Number.isInteger(Number(b.plannedQty)))){alert('Flaschenanzahlen müssen ganze, nicht negative Zahlen sein.');return;}const filled=p.packaging.reduce((a,b)=>a+Number(b.size)*Number(b.plannedQty||0),0);if(filled>p.litres+.01&&!confirm('Die geplante Abfüllmenge ist größer als die geplante Eierlikörmenge. Trotzdem speichern?'))return;db.costs[String(year)].planning=p;for(const b of p.packaging){const old=db.costs[String(year)].bottles?.find(x=>Number(x.size)===Number(b.size));if(old)old.salePrice=Number(b.salePrice)||0;}save();alert('Jahreskalkulation lokal gespeichert. Bitte oben in Dropbox speichern.');renderCosts();}
function toggleDelivered(id){let o=db.orders.find(x=>x.id===id);o.delivered=!o.delivered;save();render();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openOrder(o=null){let isEdit=!!o;document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 style="font:500 24px Georgia,serif;margin:0 0 18px">${isEdit?'Eintrag bearbeiten':'Neuer Eintrag'}</h2><div class="formgrid"><label>Art<select id="fType" class="field"><option ${o?.type==='Verkauf'?'selected':''}>Verkauf</option><option ${o?.type==='Geschenk'?'selected':''}>Geschenk</option></select></label><label>Name / Empfänger<input id="fName" class="field" value="${esc(o?.name||'')}"></label><label>Menge<input id="fQty" class="field" type="number" min=".1" step="1" value="${o?.qty??1}"></label><label>Flaschengröße<select id="fSize" class="field">${[.25,.5,1].map(s=>`<option value="${s}" ${o?.size===s?'selected':''}>${bottleLabel(s)}</option>`).join('')}</select></label><label>Datum<input id="fDate" class="field" type="date" value="${o?.date||''}"></label><label>Abgegeben<select id="fDelivered" class="field"><option value="false" ${o&&!o.delivered?'selected':''}>Noch offen</option><option value="true" ${o?.delivered?'selected':''}>Ja</option></select></label><label class="wide">Bemerkung<input id="fNote" class="field" value="${esc(o?.note||'')}"></label></div><div class="modalactions">${isEdit?`<button class="btn danger deleteModal" onclick="deleteOrder('${o.id}')">Eintrag löschen</button>`:''}<button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn" onclick="saveOrder('${o?.id||''}')">Speichern</button></div></div></div>`;}
function deleteOrder(id){const o=db.orders.find(x=>String(x.id)===String(id));if(!o)return;const message=`Eintrag wirklich löschen?\n\n${o.type}: ${o.name||'Ohne Namen'}\n${fmt(o.qty)} × ${bottleLabel(o.size)}\n\nDer Eintrag wird zunächst lokal gelöscht. Erst „Speichern“ oben überträgt die Löschung an Dropbox.`;if(!confirm(message))return;db.orders=db.orders.filter(x=>String(x.id)!==String(id));save();closeModal();render();}
function editOrder(id){openOrder(db.orders.find(o=>o.id===id));}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function saveOrder(id){let type=document.getElementById('fType').value,size=Number(document.getElementById('fSize').value),obj={id:id||('new-'+Date.now()),year,type,name:document.getElementById('fName').value.trim(),qty:Number(document.getElementById('fQty').value)||0,size,date:document.getElementById('fDate').value,delivered:document.getElementById('fDelivered').value==='true',note:document.getElementById('fNote').value,unitPrice:db.costs[String(year)]?.bottles?.find(b=>Number(b.size)===size)?.salePrice??(size===1?20:size===.5?12:8),legacy:false};if(id){let i=db.orders.findIndex(o=>o.id===id);db.orders[i]=obj;}else db.orders.push(obj);save();closeModal();render();}
function render(){({dashboard:renderDashboard,orders:renderOrders,stock:renderStock,recipe:renderRecipe,costs:renderCosts,settings:renderSettings})[page]();}

function openStockEntry(){let sizes=(db.costs[String(year)]?.bottles||[]).map(x=>x.size);if(!sizes.length){alert('Bitte zuerst Flaschengrößen in der Kalkulation anlegen.');return;}document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><h2>Produktion / Bestandskorrektur</h2><div class="formgrid"><label>Art<select id="stType" class="field"><option value="correction">Bestandskorrektur (+ oder −)</option></select></label><label>Flaschengröße<select id="stSize" class="field">${sizes.map(x=>`<option value="${x}">${bottleLabel(x)}</option>`).join('')}</select></label><label>Anzahl (Korrektur ggf. negativ)<input id="stDelta" class="field" type="number" step="1" value="1"></label><label>Datum<input id="stDate" class="field" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="wide">Notiz / Grund<input id="stNote" class="field" placeholder="z. B. 5 Liter abgefüllt oder Bruch"></label></div><div class="modalactions"><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn" onclick="saveStockEntry()">Lokal übernehmen</button></div></div></div>`;}
function saveStockEntry(){const delta=Number(document.getElementById('stDelta').value),type=document.getElementById('stType').value;if(!Number.isInteger(delta)||delta===0||(type==='production'&&delta<0)){alert('Bitte eine gültige ganze Flaschenanzahl eingeben.');return;}db.stockAdjustments ||= [];db.stockAdjustments.push({id:crypto.randomUUID(),year,size:Number(document.getElementById('stSize').value),delta,type,date:document.getElementById('stDate').value,note:document.getElementById('stNote').value});save();closeModal();render();}
function openBatch(){const sizes=(db.costs[String(year)]?.bottles||[]).map(x=>x.size);document.getElementById('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><h2>Produktion erfassen</h2><p class="muted">Trage die tatsächlich abgefüllten Flaschen ein. Die Literzahl wird daraus berechnet.</p><div class="formgrid"><label>Produktionsdatum<input class="field" id="batchDate" type="date" value="${new Date().toLocaleDateString('sv-SE')}"></label><label>Notiz<input class="field" id="batchNote" placeholder="z. B. Weihnachtsproduktion"></label>${sizes.map(s=>`<label>${bottleLabel(s)} – Anzahl<input class="field batchQty" data-size="${s}" type="number" min="0" step="1" value="0"></label>`).join('')}</div><div class="modalactions"><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn" onclick="saveBatch()">Produktion übernehmen</button></div></div></div>`;}
function saveBatch(){const entries=[...document.querySelectorAll('.batchQty')].map(e=>({size:Number(e.dataset.size),qty:Number(e.value)}));if(entries.some(e=>!Number.isInteger(e.qty)||e.qty<0)||!entries.some(e=>e.qty>0)){alert('Bitte mindestens eine gültige Flaschenanzahl eingeben.');return;}const id=crypto.randomUUID(),date=document.getElementById('batchDate').value,note=document.getElementById('batchNote').value;db.productionBatches ||= [];db.productionBatches.push({id,year,date,note,litres:entries.reduce((n,e)=>n+e.size*e.qty,0),bottles:entries.filter(e=>e.qty>0)});db.stockAdjustments ||= [];for(const e of entries.filter(e=>e.qty>0))db.stockAdjustments.push({id:crypto.randomUUID(),batchId:id,year,date,note,delta:e.qty,size:e.size,type:'production'});save();closeModal();render();}
async function importHistoryFile(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;let incoming;try{incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.orders)||!incoming.costs||!Array.isArray(incoming.recipe))throw Error('Unbekanntes Dateiformat');}catch(e){alert('Import nicht möglich: '+e.message);return;}const existing=new Set(db.orders.map(o=>String(o.id))),newOrders=incoming.orders.filter(o=>!existing.has(String(o.id)));const oldYears=Object.keys(incoming.costs);const costYears=oldYears.filter(y=>!db.costs[y]||(!db.costs[y].ingredients?.length&&!db.costs[y].plannedLitres&&!db.costs[y].bottles?.some(b=>b.count)));const answer=confirm(`Historie importieren?\n${newOrders.length} zusätzliche Bestellungen / Geschenke.\n${costYears.length} Kalkulationsjahre werden ergänzt.\nVorhandene Einträge werden NICHT überschrieben.\n\nBitte vorher eine Sicherung herunterladen. Der Import wird zunächst nur lokal gespeichert.`);if(!answer)return;db.orders.push(...newOrders);for(const y of costYears)db.costs[y]=incoming.costs[y];if(!db.recipe?.length)db.recipe=incoming.recipe;db.importedAt=new Date().toISOString();save();refreshYears();render();cloudMsg(`Import lokal abgeschlossen: ${newOrders.length} Einträge ergänzt. Bitte Bestände/Kalkulationen prüfen, dann in Dropbox speichern.`);alert(`Import abgeschlossen: ${newOrders.length} neue Einträge. Noch NICHT in Dropbox gespeichert!`);}
function cloudMsg(message){const el=document.getElementById('cloudMessage');if(el)el.textContent=message;}
function updateCloudUI(){const badge=document.getElementById('syncState');if(!badge)return;badge.textContent=dirty?'Lokale Änderungen nicht hochgeladen':tokenData?'Dropbox verbunden':'Nicht verbunden';document.getElementById('connectBtn').textContent=tokenData?'⚙ Dropbox':'Dropbox verbinden';const keyField=document.getElementById('appKey');if(keyField&&document.activeElement!==keyField)keyField.value=localStorage.getItem(keyKey)||'';}
function redirectUri(){return location.origin+location.pathname;}
function b64url(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function sha256(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));}
async function connectDropbox(){if(location.protocol!=='https:'&&location.hostname!=='localhost'){alert('Für die Dropbox-Anmeldung muss die App unter einer HTTPS-Adresse erreichbar sein. Eine lokale HTML-Datei reicht dafür nicht.');return;}const key=document.getElementById('appKey').value.trim();if(!key){alert('Bitte zuerst den Dropbox App-Key eintragen.');return;}localStorage.setItem(keyKey,key);const verifier=b64url(crypto.getRandomValues(new Uint8Array(32))),challenge=b64url(await sha256(verifier)),state=b64url(crypto.getRandomValues(new Uint8Array(16)));sessionStorage.setItem('dbx_pkce',JSON.stringify({verifier,state}));const url=new URL('https://www.dropbox.com/oauth2/authorize');Object.entries({client_id:key,response_type:'code',token_access_type:'offline',code_challenge_method:'S256',code_challenge:challenge,redirect_uri:redirectUri(),state}).forEach(([k,v])=>url.searchParams.set(k,v));location.assign(url.toString());}
async function handleDropboxCallback(){const params=new URLSearchParams(location.search);if(!params.has('code')&&!params.has('error'))return;history.replaceState({},'',redirectUri());if(params.has('error')){cloudMsg('Dropbox-Anmeldung abgebrochen: '+params.get('error'));return;}const pkce=JSON.parse(sessionStorage.getItem('dbx_pkce')||'null');sessionStorage.removeItem('dbx_pkce');if(!pkce||params.get('state')!==pkce.state){cloudMsg('Sicherheitsprüfung der Dropbox-Anmeldung fehlgeschlagen.');return;}const body=new URLSearchParams({code:params.get('code'),grant_type:'authorization_code',client_id:localStorage.getItem(keyKey),code_verifier:pkce.verifier,redirect_uri:redirectUri()});try{const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body});const x=await r.json();if(!r.ok)throw Error(x.error_description||x.error||r.status);tokenData={access_token:x.access_token,refresh_token:x.refresh_token,expires_at:Date.now()+x.expires_in*1000};sessionStorage.setItem(tokenKey,JSON.stringify(tokenData));cloudMsg('Dropbox verbunden. Bitte zuerst „Aktuellen Stand laden“ wählen.');updateCloudUI();}catch(e){cloudMsg('Dropbox-Anmeldung fehlgeschlagen: '+e.message);}}
async function accessToken(){if(!tokenData)throw Error('Bitte zuerst Dropbox verbinden.');if(Date.now()<tokenData.expires_at-60000)return tokenData.access_token;const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:tokenData.refresh_token,client_id:localStorage.getItem(keyKey)});const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body});const x=await r.json();if(!r.ok)throw Error(x.error_description||x.error||r.status);tokenData={...tokenData,access_token:x.access_token,expires_at:Date.now()+x.expires_in*1000};sessionStorage.setItem(tokenKey,JSON.stringify(tokenData));return tokenData.access_token;}
async function dbxMeta(){const r=await fetch('https://api.dropboxapi.com/2/files/get_metadata',{method:'POST',headers:{Authorization:'Bearer '+await accessToken(),'Content-Type':'application/json'},body:JSON.stringify({path:DROPBOX_PATH})});if(r.status===409)return null;if(!r.ok)throw Error('Dropbox-Metadaten: '+r.status+' '+(await r.text()).slice(0,200));return r.json();}
async function loadDropbox(){try{if(dirty&&!confirm('Du hast lokale, noch nicht hochgeladene Änderungen. Diese beim Laden verwerfen?'))return;cloudMsg('Lade aktuelle Dropbox-Daten …');const meta=await dbxMeta();if(!meta){cloudMsg('Noch keine gemeinsame Datei vorhanden. Du kannst den aktuellen lokalen Stand mit „In Dropbox speichern“ erstmals hochladen.');remoteRev=null;localStorage.removeItem('likoer_remote_rev');return;}const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await accessToken(),'Dropbox-API-Arg':JSON.stringify({path:DROPBOX_PATH})}});if(!r.ok)throw Error('Download: '+r.status);const parsed=JSON.parse(await r.text());if(!parsed||!Array.isArray(parsed.orders)||!parsed.costs||!Array.isArray(parsed.recipe))throw Error('Dateiformat unerwartet – nichts überschrieben.');db=parsed;refreshYears();remoteRev=meta.rev;localStorage.setItem('likoer_db',JSON.stringify(db));localStorage.setItem('likoer_remote_rev',remoteRev);dirty=false;localStorage.removeItem('likoer_dirty');render();updateCloudUI();cloudMsg('Aktueller Dropbox-Stand geladen.');}catch(e){cloudMsg('Laden fehlgeschlagen: '+e.message);}}
async function uploadDropbox(){try{if(!tokenData)throw Error('Bitte zuerst Dropbox verbinden.');cloudMsg('Prüfe Dropbox-Datei …');const meta=await dbxMeta();if(meta&&(!remoteRev||meta.rev!==remoteRev)){cloudMsg('Speicherkonflikt: Dropbox enthält einen anderen Stand. Bitte erst eine Sicherung herunterladen und anschließend den aktuellen Stand laden. Nichts wurde überschrieben.');return;}if(!meta&&!confirm('Noch keine Dropbox-Datei vorhanden. Möchtest du den aktuellen lokalen Datenbestand als gemeinsame Datei anlegen?'))return;const mode=meta?{'.tag':'update',update:remoteRev}:{'.tag':'add'};const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await accessToken(),'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path:DROPBOX_PATH,mode,autorename:false,mute:true})},body:JSON.stringify(db)});if(!r.ok){if(r.status===409)throw Error('Speicherkonflikt: Die Datei wurde inzwischen verändert. Bitte erst eine Sicherung herunterladen und neu laden.');throw Error('Upload: '+r.status+' '+(await r.text()).slice(0,160));}const result=await r.json();remoteRev=result.rev;localStorage.setItem('likoer_remote_rev',remoteRev);dirty=false;localStorage.removeItem('likoer_dirty');updateCloudUI();cloudMsg('Erfolgreich in Dropbox gespeichert. Jetzt kann das andere Gerät den aktuellen Stand laden.');}catch(e){cloudMsg('Speichern fehlgeschlagen: '+e.message);}}
async function restoreBackup(event){const f=event.target.files?.[0];event.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.orders)||!data.costs||!Array.isArray(data.recipe))throw Error('Unbekanntes Dateiformat');if(!confirm('Lokalen Datenstand vollständig durch diese Sicherung ersetzen? Bitte vorher eine aktuelle Sicherung herunterladen.'))return;db=data;save();refreshYears();go('dashboard');alert('Sicherung lokal eingelesen. Bitte prüfen und erst danach in Dropbox speichern.');}catch(e){alert('Sicherung konnte nicht eingelesen werden: '+e.message)}}
function downloadBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eierlikoer-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function disconnectDropbox(){tokenData=null;sessionStorage.removeItem(tokenKey);updateCloudUI();cloudMsg('Dropbox auf diesem Gerät getrennt. Die lokale Kopie bleibt erhalten.');}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

refreshYears();go('dashboard');updateCloudUI();handleDropboxCallback();
</script></body></html>
