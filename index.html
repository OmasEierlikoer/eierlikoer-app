let dirty=localStorage.getItem('likoer_dirty')==='1';

const fmt=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(Number(n)||0);
const bottleLabel=s=>s===1?'1.000 ml':s===.5?'500 ml':s===.25?'250 ml':fmt(s*1000)+' ml';

function stats(){let a=rows(),sales=a.filter(x=>x.type==='Verkauf'),gifts=a.filter(x=>x.type==='Geschenk'),revenue=sales.reduce((s,x)=>s+x.qty*x.unitPrice,0),litres=a.reduce((s,x)=>s+x.qty*x.size,0);return {a,sales,gifts,revenue,litres,open:a.filter(x=>!x.delivered).length};}
function inventory(){let c=db.costs[String(year)]||{}, bottles=c.bottles||[];return bottles.map(b=>{let a=rows().filter(x=>x.size===b.size),reserved=a.filter(x=>!x.delivered).reduce((s,x)=>s+x.qty,0),delivered=a.filter(x=>x.delivered).reduce((s,x)=>s+x.qty,0),adjustments=(db.stockAdjustments||[]).filter(x=>Number(x.year)===Number(year)&&Number(x.size)===Number(b.size)).reduce((s,x)=>s+Number(x.delta),0),onHand=Number(b.count||0)+adjustments-delivered;return {...b,reserved,delivered,adjustments,onHand,available:onHand-reserved};});}

function refreshYears(){const el=document.getElementById('yearSelect');const years=Object.keys(db.costs||{}).map(Number).sort((a,b)=>b-a);el.innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');if(!years.includes(year))year=years[0]||new Date().getFullYear();el.value=year;}
function addYear(){const available=Object.keys(db.costs||{}).map(Number);const next=Math.max(new Date().getFullYear()-1,...available)+1;if(db.costs[String(next)])return;const previous=db.costs[String(next-1)]||db.costs[String(Math.max(...available))]||{ingredients:[],bottles:[]};if(!confirm(`Neues Jahr ${next} anlegen?\n\nFlaschengrößen, Einkaufspreise und Zutaten werden als Vorlage übernommen. Bestellungen und Ausgangsbestände starten leer.`))return;db.costs[String(next)]={plannedLitres:0,ingredients:(previous.ingredients||[]).map(x=>({...x})),bottles:(previous.bottles||[]).map(b=>({...b,count:0}))};save();year=next;refreshYears();go('dashboard');}

function renderSettings(){document.getElementById('settings').innerHTML=`
<div class="panel"><h2>So funktioniert die Nutzung</h2><ol class="guide"><li><b>Öffnen:</b> App starten und bei Bedarf Dropbox verbinden.</li><li><b>Laden:</b> Oben auf „Laden“ tippen, bevor ihr etwas ändert.</li><li><b>Bearbeiten:</b> Bestellungen, Produktionen oder Kalkulationen eintragen.</li><li><b>Speichern:</b> Oben auf „Speichern“ tippen. Erst danach sieht das andere Gerät die Änderungen nach erneutem Laden.</li></ol><p class="muted">Wenn ihr nur nachschaut, müsst ihr nicht speichern. Bitte nicht gleichzeitig auf zwei Geräten bearbeiten.</p></div>
<div class="panel"><div class="panelhead"><h2>Dropbox-Verbindung</h2></div>
<p class="muted">Für den gemeinsamen Datenstand. Beim ersten Mal oder nach Ablauf der Anmeldung erneut verbinden.</p>

function calcNumbers(p){let ingredientCost=0,ingredientPurchases=0,issues=[];for(const x of p.ingredients){const pq=calcUnitBase(x.packQty,x.packUnit),uq=calcUnitBase(x.usedQty,x.usedUnit),price=Number(x.packPrice)||0;if(calcUnitFamily(x.packUnit)!==calcUnitFamily(x.usedUnit)){issues.push(`Einheiten bei ${x.name||'Zutat'} stimmen nicht überein`);continue;}if(uq>0&&pq<=0){issues.push(`Packungsmenge bei ${x.name||'Zutat'} fehlt`);continue;}if(pq>0){ingredientCost+=uq/pq*price;ingredientPurchases+=Math.ceil(uq/pq)*price;}}

async function importHistoryFile(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;let incoming;try{incoming=JSON.parse(await file.text());if(!Array.isArray(incoming.orders)||!incoming.costs||!Array.isArray(incoming.recipe))throw Error('Unbekanntes Dateiformat');}catch(e){alert('Import nicht möglich: '+e.message);return;}const existing=new Set(db.orders.map(o=>String(o.id))),newOrders=incoming.orders.filter(o=>!existing.has(String(o.id)));const oldYears=Object.keys(incoming.costs);const costYears=oldYears.filter(y=>!db.costs[y]||(!db.costs[y].ingredients?.length&&!db.costs[y].plannedLitres&&!db.costs[y].bottles?.some(b=>b.count)));const answer=confirm(`Historie importieren?\n${newOrders.length} zusätzliche Bestellungen / Geschenke.\n${costYears.length} Kalkulationsjahre werden ergänzt.\nVorhandene Einträge werden NICHT überschrieben.\n\nBitte vorher eine Sicherung herunterladen. Der Import wird zunächst nur lokal gespeichert.`);if(!answer)return;db.orders.push(...newOrders);for(const y of costYears)db.costs[y]=incoming.costs[y];if(!db.recipe?.length)db.recipe=incoming.recipe;db.importedAt=new Date().toISOString();save();refreshYears();render();cloudMsg(`Import lokal abgeschlossen: ${newOrders.length} Einträge ergänzt. Bitte Bestände/Kalkulationen prüfen, dann in Dropbox speichern.`);alert(`Import abgeschlossen: ${newOrders.length} neue Einträge. Noch NICHT in Dropbox gespeichert!`);}

async function sha256(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));}
async function connectDropbox(){if(location.protocol!=='https:'&&location.hostname!=='localhost'){alert('Für die Dropbox-Anmeldung muss die App unter einer HTTPS-Adresse erreichbar sein. Eine lokale HTML-Datei reicht dafür nicht.');return;}const key=document.getElementById('appKey').value.trim();if(!key){alert('Bitte zuerst den Dropbox App-Key eintragen.');return;}localStorage.setItem(keyKey,key);const verifier=b64url(crypto.getRandomValues(new Uint8Array(32))),challenge=b64url(await sha256(verifier)),state=b64url(crypto.getRandomValues(new Uint8Array(16)));sessionStorage.setItem('dbx_pkce',JSON.stringify({verifier,state}));const url=new URL('https://www.dropbox.com/oauth2/authorize');Object.entries({client_id:key,response_type:'code',token_access_type:'offline',code_challenge_method:'S256',code_challenge:challenge,redirect_uri:redirectUri(),state}).forEach(([k,v])=>url.searchParams.set(k,v));location.assign(url.toString());}
async function handleDropboxCallback(){const params=new URLSearchParams(location.search);if(!params.has('code')&&!params.has('error'))return;history.replaceState({},'',redirectUri());if(params.has('error')){cloudMsg('Dropbox-Anmeldung abgebrochen: '+params.get('error'));return;}const pkce=JSON.parse(sessionStorage.getItem('dbx_pkce')||'null');sessionStorage.removeItem('dbx_pkce');if(!pkce||params.get('state')!==pkce.state){cloudMsg('Sicherheitsprüfung der Dropbox-Anmeldung fehlgeschlagen.');return;}const body=new URLSearchParams({code:params.get('code'),grant_type:'authorization_code',client_id:localStorage.getItem(keyKey),code_verifier:pkce.verifier,redirect_uri:redirectUri()});try{const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body});const x=await r.json();if(!r.ok)throw Error(x.error_description||x.error||r.status);tokenData={access_token:x.access_token,refresh_token:x.refresh_token,expires_at:Date.now()+x.expires_in*1000};localStorage.setItem(tokenKey,JSON.stringify(tokenData));cloudMsg('Dropbox verbunden. Bitte zuerst „Aktuellen Stand laden“ wählen.');updateCloudUI();}catch(e){cloudMsg('Dropbox-Anmeldung fehlgeschlagen: '+e.message);}}
async function accessToken(){if(!tokenData)throw Error('Bitte zuerst Dropbox verbinden.');if(Date.now()<tokenData.expires_at-60000)return tokenData.access_token;const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:tokenData.refresh_token,client_id:localStorage.getItem(keyKey)});const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body});const x=await r.json();if(!r.ok)throw Error(x.error_description||x.error||r.status);tokenData={...tokenData,access_token:x.access_token,expires_at:Date.now()+x.expires_in*1000};localStorage.setItem(tokenKey,JSON.stringify(tokenData));return tokenData.access_token;}
async function dbxMeta(){const r=await fetch('https://api.dropboxapi.com/2/files/get_metadata',{method:'POST',headers:{Authorization:'Bearer '+await accessToken(),'Content-Type':'application/json'},body:JSON.stringify({path:DROPBOX_PATH})});if(r.status===409)return null;if(!r.ok)throw Error('Dropbox-Metadaten: '+r.status+' '+(await r.text()).slice(0,200));return r.json();}
async function loadDropbox(){try{if(dirty&&!confirm('Du hast lokale, noch nicht hochgeladene Änderungen. Diese beim Laden verwerfen?'))return;cloudMsg('Lade aktuelle Dropbox-Daten …');const meta=await dbxMeta();if(!meta){cloudMsg('Noch keine gemeinsame Datei vorhanden. Du kannst den aktuellen lokalen Stand mit „In Dropbox speichern“ erstmals hochladen.');remoteRev=null;localStorage.removeItem('likoer_remote_rev');return;}const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await accessToken(),'Dropbox-API-Arg':JSON.stringify({path:DROPBOX_PATH})}});if(!r.ok)throw Error('Download: '+r.status);const parsed=JSON.parse(await r.text());if(!parsed||!Array.isArray(parsed.orders)||!parsed.costs||!Array.isArray(parsed.recipe))throw Error('Dateiformat unerwartet – nichts überschrieben.');db=parsed;refreshYears();remoteRev=meta.rev;localStorage.setItem('likoer_db',JSON.stringify(db));localStorage.setItem('likoer_remote_rev',remoteRev);dirty=false;localStorage.removeItem('likoer_dirty');render();updateCloudUI();cloudMsg('Aktueller Dropbox-Stand geladen.');}catch(e){cloudMsg('Laden fehlgeschlagen: '+e.message);alert('Dropbox: Laden fehlgeschlagen. '+e.message);}}
async function uploadDropbox(){try{if(!tokenData)throw Error('Bitte unter Einstellungen Dropbox verbinden.');cloudMsg('Prüfe Dropbox-Datei …');const meta=await dbxMeta();if(meta&&(!remoteRev||meta.rev!==remoteRev)){cloudMsg('Speicherkonflikt: Dropbox enthält einen anderen Stand. Bitte erst eine Sicherung herunterladen und anschließend den aktuellen Stand laden. Nichts wurde überschrieben.');return;}if(!meta&&!confirm('Noch keine Dropbox-Datei vorhanden. Möchtest du den aktuellen lokalen Datenbestand als gemeinsame Datei anlegen?'))return;const mode=meta?{'.tag':'update',update:remoteRev}:{'.tag':'add'};const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await accessToken(),'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path:DROPBOX_PATH,mode,autorename:false,mute:true})},body:JSON.stringify(db)});if(!r.ok){if(r.status===409)throw Error('Speicherkonflikt: Die Datei wurde inzwischen verändert. Bitte erst eine Sicherung herunterladen und neu laden.');throw Error('Upload: '+r.status+' '+(await r.text()).slice(0,160));}const result=await r.json();remoteRev=result.rev;localStorage.setItem('likoer_remote_rev',remoteRev);dirty=false;localStorage.removeItem('likoer_dirty');updateCloudUI();cloudMsg('Erfolgreich in Dropbox gespeichert. Jetzt kann das andere Gerät den aktuellen Stand laden.');}catch(e){cloudMsg('Speichern fehlgeschlagen: '+e.message);alert('Dropbox: Speichern fehlgeschlagen. '+e.message);}}
async function restoreBackup(event){const f=event.target.files?.[0];event.target.value='';if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.orders)||!data.costs||!Array.isArray(data.recipe))throw Error('Unbekanntes Dateiformat');if(!confirm('Lokalen Datenstand vollständig durch diese Sicherung ersetzen? Bitte vorher eine aktuelle Sicherung herunterladen.'))return;db=data;save();refreshYears();go('dashboard');alert('Sicherung lokal eingelesen. Bitte prüfen und erst danach in Dropbox speichern.');}catch(e){alert('Sicherung konnte nicht eingelesen werden: '+e.message)}}
function downloadBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eierlikoer-sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function disconnectDropbox(){tokenData=null;sessionStorage.removeItem(tokenKey);localStorage.removeItem(tokenKey);updateCloudUI();cloudMsg('Dropbox auf diesem Gerät getrennt. Die lokale Kopie bleibt erhalten.');}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

refreshYears();go('dashboard');updateCloudUI();handleDropboxCallback();
</script></body></html>
